spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  jpa:
    show-sql: false

logging:
  level:
    com.gymsaas: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
