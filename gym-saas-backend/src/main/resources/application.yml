server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: gym-saas-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000} # 30 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
  rate-limit:
    login-capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
    login-refill-tokens: ${RATE_LIMIT_LOGIN_REFILL_TOKENS:10}
    login-refill-duration-minutes: ${RATE_LIMIT_LOGIN_REFILL_DURATION_MINUTES:1}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
